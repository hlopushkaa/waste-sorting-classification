name: effb0_feature_extraction
backbone: efficientnet_b0        # timm efficientnet_b0.ra_in1k (ImageNet-1k)
strategy: feature_extraction     # backbone frozen, only the new head is trained
weights_file: weights/efficientnet_b0_ra-3dd342df.pth   # set to null to download automatically
data_root: data/raw/dataset-resized
split_csv: data/splits.csv
output_dir: runs
img_size: 224
batch_size: 32
num_workers: 2
dropout: 0.3
class_weighted_loss: true
label_smoothing: 0.0
head_lr: 1.0e-3
backbone_lr: 1.0e-4              # unused while the backbone is frozen
weight_decay: 1.0e-4
epochs: 15
warmup_epochs: 1
patience: 5
seed: 42
