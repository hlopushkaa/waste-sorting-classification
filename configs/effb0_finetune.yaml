name: effb0_finetune
backbone: efficientnet_b0        # timm efficientnet_b0.ra_in1k (ImageNet-1k)
strategy: full_finetune          # all layers are trained; BatchNorm statistics adapt to TrashNet
weights_file: weights/efficientnet_b0_ra-3dd342df.pth   # set to null to download automatically
data_root: data/raw/dataset-resized
split_csv: data/splits.csv
output_dir: runs
img_size: 224
batch_size: 32
num_workers: 6
persistent_workers: true         # keep training workers alive between epochs
dropout: 0.2
class_weighted_loss: true
label_smoothing: 0.1             # softer targets: less over-confident errors on look-alike classes
head_lr: 1.0e-3
backbone_lr: 1.0e-4              # 10x lower than the head so pretrained features are not destroyed
weight_decay: 1.0e-2
epochs: 30
warmup_epochs: 1
patience: 7
seed: 6545656
amp: true                        # float16 mixed precision on GPU (ignored on CPU)
channels_last: true              # faster convolutions on Tensor-Core GPUs
