[workspace]
channels = ["conda-forge"]
name = "waste-sorting"
platforms = [
    { platform = "linux-64", cuda = "13" },
    { platform = "win-64", cuda = "13" },
    "osx-64",
    "osx-arm64",
]
version = "0.1.0"

[tasks]
prepare = "python scripts/prepare_data.py --root data/raw/dataset-resized"
train = "python -m src.train --config configs/baseline_effb0_fe.yaml"
evaluate = "python -m src.evaluate --config configs/baseline_effb0_fe.yaml"
train-ft = "python -m src.train --config configs/effb0_finetune.yaml"
evaluate-ft = "python -m src.evaluate --config configs/effb0_finetune.yaml"
evaluate-ft-tta = "python -m src.evaluate --config configs/effb0_finetune.yaml --tta"
export-ft = "python -m src.export --config configs/effb0_finetune.yaml"

[dependencies]
pytorch = ">=2.2"
torchvision = ">=0.17"
timm = ">=1.0"
scikit-learn = ">=1.3"
pandas = ">=2.0"
matplotlib = ">=3.7"
pyyaml = ">=6.0"
pillow = ">=10.0"
onnx = ">=1.15"
onnxruntime = ">=1.17"

[target.linux-64.dependencies]
pytorch-gpu = "*"

[target.win-64.dependencies]
pytorch-gpu = "*"