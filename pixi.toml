[workspace]
channels = ["conda-forge"]
name = "waste-sorting"
platforms = [
    { platform = "linux-64", cuda = "13" },
    { platform = "win-64", cuda = "13" },
    "osx-64",
    "osx-arm64",
]
version = "0.1.0"

[tasks]
prepare = "python scripts/prepare_data.py --root data/raw/dataset-resized"
train = "python -m src.train --config configs/baseline_effb0_fe.yaml"
evaluate = "python -m src.evaluate --config configs/baseline_effb0_fe.yaml"

[dependencies]
pytorch = ">=2.2"
torchvision = ">=0.17"
timm = ">=1.0"
scikit-learn = ">=1.3"
pandas = ">=2.0"
matplotlib = ">=3.7"
pyyaml = ">=6.0"
pillow = ">=10.0"

[target.linux-64.dependencies]
pytorch-gpu = "*"

[target.win-64.dependencies]
pytorch-gpu = "*"